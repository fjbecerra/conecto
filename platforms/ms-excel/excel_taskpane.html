<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>HTTP Request Task Pane</title>
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://appsforoffice.microsoft.com/fabric/2-14/fabric.components.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background-color: #ffffff;
            color: #201f1e;
            font-size: 14px;
            line-height: 1.5;
            overflow-y: auto;
        }

        .container {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            border-bottom: 1px solid #e1dfdd;
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #201f1e;
            margin: 0 0 4px 0;
        }

        .header p {
            font-size: 12px;
            color: #605e5c;
            margin: 0;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: #201f1e;
            display: block;
        }

        select, input {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            padding: 6px 8px;
            border: 1px solid #d2d0ce;
            border-radius: 2px;
            color: #201f1e;
            transition: all 0.15s ease;
        }

        select {
            background-color: #ffffff;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3e%3cpath fill='%23201f1e' d='M1 1l5 5 5-5'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 6px center;
            background-size: 12px;
            padding-right: 28px;
        }

        select:hover {
            border-color: #a19f9d;
            background-color: #faf9f8;
        }

        select:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: inset 0 0 0 1px #0078d4;
        }

        input[type="text"] {
            background-color: #ffffff;
        }

        input[type="text"]::placeholder {
            color: #a19f9d;
        }

        input[type="text"]:hover {
            border-color: #a19f9d;
            background-color: #faf9f8;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #0078d4;
            box-shadow: inset 0 0 0 1px #0078d4;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .input-wrapper input {
            flex: 1;
            min-width: 0;
        }

        button {
            padding: 6px 20px;
            background-color: #0078d4;
            color: #ffffff;
            border: 1px solid #0078d4;
            border-radius: 2px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            outline: none;
            user-select: none;
        }

        button:hover {
            background-color: #106ebe;
            border-color: #106ebe;
        }

        button:active {
            background-color: #005a9e;
            border-color: #005a9e;
        }

        button:disabled {
            background-color: #f0f0f0;
            color: #a19f9d;
            border-color: #e1dfdd;
            cursor: not-allowed;
        }

        .helper-text {
            font-size: 11px;
            color: #605e5c;
            margin-top: 2px;
        }

        .status {
            padding: 10px 12px;
            border-radius: 2px;
            font-size: 12px;
            line-height: 1.4;
            display: none;
            border-left: 3px solid;
        }

        .status.success {
            display: block;
            background-color: #f1f5f9;
            color: #107c10;
            border-left-color: #107c10;
        }

        .status.error {
            display: block;
            background-color: #fdf6f6;
            color: #a4373a;
            border-left-color: #a4373a;
        }

        .status.loading {
            display: block;
            background-color: #f5f5f5;
            color: #323130;
            border-left-color: #0078d4;
        }

        .status::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .status.success::before {
            background-color: #107c10;
        }

        .status.error::before {
            background-color: #a4373a;
        }

        .status.loading::before {
            background-color: #0078d4;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>HTTP Request</h1>
            <p>Execute HTTP requests and write results to Excel</p>
        </div>

        <form id="requestForm" class="form-section">
            <div class="form-group">
                <label for="httpMethod">HTTP Method</label>
                <select id="httpMethod" name="httpMethod" required>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                </select>
            </div>

            <div class="form-group">
                <label for="urlInput">URL</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="urlInput" 
                        name="url" 
                        placeholder="https://api.example.com/endpoint"
                        required
                    >
                    <button type="submit" id="runButton">Run</button>
                </div>
            </div>

            <div class="form-group">
                <label for="cellReference">Write Result to Cell</label>
                <input 
                    type="text" 
                    id="cellReference" 
                    name="cellReference" 
                    placeholder="A1"
                    value="A1"
                >
                <div class="helper-text">Results will be written as JSON to the specified cell</div>
            </div>
        </form>

        <div id="statusMessage" class="status"></div>
    </div>

    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script>
        // Initialize Office Add-in
        Office.onReady((reason) => {
            if (reason === Office.Initialize.Reason.ContentDocumentInitialized) {
                console.log('Office Add-in initialized');
            }
        });

        document.getElementById('requestForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const httpMethod = document.getElementById('httpMethod').value;
            const url = document.getElementById('urlInput').value;
            const cellReference = document.getElementById('cellReference').value.toUpperCase();
            const statusDiv = document.getElementById('statusMessage');
            const runButton = document.getElementById('runButton');

            // Validation
            if (!url.trim()) {
                statusDiv.textContent = 'Please enter a valid URL';
                statusDiv.className = 'status error';
                return;
            }

            // Show loading state
            statusDiv.textContent = 'Sending request...';
            statusDiv.className = 'status loading';
            runButton.disabled = true;

            try {
                const response = await fetch(url, {
                    method: httpMethod,
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    // Write to Excel
                    await Excel.run(async (context) => {
                        const sheet = context.workbook.worksheets.getActiveWorksheet();
                        const range = sheet.getRange(cellReference);
                        
                        // Convert data to string
                        const resultString = JSON.stringify(data, null, 2);
                        
                        // Set the value
                        range.values = [[resultString]];
                        
                        // Format the cell
                        range.format.wrapText = true;
                        range.format.font.size = 11;
                        range.format.font.name = 'Courier New';
                        
                        await context.sync();
                    });

                    statusDiv.textContent = `Request successful (${response.status}) — Data written to ${cellReference}`;
                    statusDiv.className = 'status success';
                    console.log('Response:', data);
                } else {
                    statusDiv.textContent = `Request failed (${response.status} ${response.statusText})`;
                    statusDiv.className = 'status error';
                }
            } catch (error) {
                statusDiv.textContent = `Error: ${error.message}`;
                statusDiv.className = 'status error';
            } finally {
                runButton.disabled = false;
            }
        });
    </script>
</body>
</html>
